<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/favicon.png" />
    <title>CSMAR</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      var __path__full__ = '/index'
      var search = window.location.search
      //  如果传递的有参数
      if (search) {
        search = parseSearchQuery(search)
        // 外部跳转参数独立落盘，有 search 即清 URL 避免残留
        ;['t', 'from', 'p', 'course'].forEach(function(key) {
          search[key] &&
            sessionStorage.setItem('solution_' + key, search[key])
        })
        history.replaceState({ page: 'index' }, '', '/')
      } else {
        __path__full__ = decodeURI(localStorage.getItem('__path__full__'))
        if (
          !__path__full__ ||
          __path__full__ === 'null' ||
          !/\/.+/.test(__path__full__)
        ) {
          __path__full__ = '/index'
        }
        var lastTime = Number(localStorage.getItem('lastTime'))
        if (lastTime && Date.now() - lastTime > 40 * 60 * 1000) {
          __path__full__ = '/index'
        }
      }
      var path = '/csmar.html?v=' + Date.now() + '#' + __path__full__
      var iframe = document.createElement('iframe')
      iframe.setAttribute('src', path)
      document.body.appendChild(iframe)

      function parseSearchQuery(a) {
        a = a.slice(1)
        var c = {}
        a.split('\x26').forEach(function(a) {
          var b = a.split('\x3d')
          a = b[0]
          b = decodeURIComponent(b[1])
          c[a] = b
        })
        return c
      }
    </script>
  </body>
</html>
